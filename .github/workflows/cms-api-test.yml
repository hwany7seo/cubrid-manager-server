name: CMS API test

# Builds CUBRID with this PR's manager server and runs the API test suite
# (server/test, task_result_check) against it.
#
# The result never blocks a merge: the job finishes green either way and says
# PASS or FAIL in the job summary and in a comment on the PR. To make it
# blocking instead, replace the "exit 0" at the end of the test step with
# "exit $status" and mark this check as required in the branch protection
# rules for develop.
#
# TRYING IT OUT IN A FORK
#   The push trigger below runs the whole thing on any branch, but only when
#   the repository is not CUBRID/cubrid-manager-server -- pushing a branch to
#   the real repository must not start a three hour build. So in a fork it is
#   enough to push the branch that carries this file.
#
#   To build against a fork of the engine as well, set the repository variable
#   ENGINE_REPO (Settings > Secrets and variables > Actions > Variables) or
#   pass engine_repo when running it by hand. It defaults to CUBRID/cubrid.
#
#   Nothing else is fork specific: the engine is public, so no token is needed,
#   and the PR comment step is already allowed to fail where there is no write
#   token.

on:
  pull_request:
    branches: [develop]
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      engine_repo:
        description: 'engine repository to build against'
        default: CUBRID/cubrid
        required: false
      engine_ref:
        description: 'engine branch or tag to build against'
        default: develop
        required: false

concurrency:
  group: cms-api-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # for the result comment

env:
  # inputs win, then the repository variable a fork can set, then the default
  ENGINE_REPO: ${{ github.event.inputs.engine_repo || vars.ENGINE_REPO || 'CUBRID/cubrid' }}
  ENGINE_REF: ${{ github.event.inputs.engine_ref || vars.ENGINE_REF || 'develop' }}
  TEST_SET: task_result_check.txt

jobs:
  cms-api-test:
    # A push only builds in a fork; in the real repository this runs on pull
    # requests to develop and on demand.
    if: >-
      github.event_name != 'push' ||
      github.repository != 'CUBRID/cubrid-manager-server'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # The manager server is a submodule of CUBRID/cubrid at path
      # "cubridmanager", and it is built as part of the engine. So the engine
      # is what gets checked out, and this PR replaces that submodule.
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          submodules: recursive
          fetch-depth: 1
          path: cubrid

      - name: Check out this PR over the cubridmanager submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: cubrid/cubridmanager

      # The engine's VERSION file ("11.5.0") decides which baseline directory
      # the test compares against, so 11.4 and 11.5 do not share one.
      - name: Resolve the test version from VERSION
        id: version
        working-directory: cubrid
        run: |
          set -euo pipefail
          full=$(tr -d '[:space:]' < VERSION)
          short=$(echo "$full" | cut -d. -f1,2)
          dir=${short/./_}
          echo "full=$full"   >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "dir=$dir"     >> "$GITHUB_OUTPUT"
          echo "engine VERSION=$full -> test version $short (baselines in $dir/)"

          # Without a baseline for this version every compared case fails on a
          # missing .answer, which is a setup gap rather than a regression.
          baselines="cubridmanager/server/test/task_test_case/task_result_check/$dir"
          if [ -z "$(ls -A "$baselines"/*.answer 2>/dev/null)" ]; then
            echo "::warning title=No baseline::$dir has no .answer files; run \
              './run_tests.sh -a $short task_result_check.txt' on a $short build and commit them"
          fi

      - name: Install build and test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache \
            autoconf automake libtool bison flex \
            libncurses-dev libexpat1-dev zlib1g-dev \
            ant systemtap-sdt-dev rsync

      # The engine builds against JDK 8; a newer default JDK on the runner
      # produces class files the build will not accept.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache the compiler output
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ env.ENGINE_REF }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.ENGINE_REF }}-
            ccache-${{ runner.os }}-

      # Two things about the libtbb external project have to be adjusted for
      # this runner, and both are patched into the checked out engine source so
      # that the result is visible in the log.
      #
      # 1. It builds with a bare "make -j", meaning unlimited jobs.
      # 2. oneTBB compiles with TBB_STRICT=ON by default, which adds -Werror.
      #    GCC 13 raises a false -Wstringop-overflow inside its own
      #    <atomic> for tbb's concurrent_monitor, so every strict build stops at
      #    "writing 1 byte into a region of size 0 overflows the destination".
      #    The warning is about libstdc++ internals, not about CUBRID code.
      #
      # Both belong upstream in CUBRID/cubrid, 3rdparty/CMakeLists.txt.
      - name: Adjust the libtbb external project for this runner
        working-directory: cubrid
        run: |
          set -euo pipefail
          f=3rdparty/CMakeLists.txt
          sed -i -E "s/(BUILD_COMMAND[[:space:]]+make) -j$/\1 -j$(nproc)/;
                     s/(INSTALL_COMMAND[[:space:]]+make) -j install$/\1 -j$(nproc) install/;
                     s/(set\(LIBTBB_CONFIGURE) /\1 -DTBB_STRICT=OFF /" "$f"
          echo "libtbb build commands and configure options are now:"
          grep -n -E 'LIBTBB_CONFIGURE|make -j' "$f" | cut -c1-200 | sed 's/^/  /'
          grep -q 'TBB_STRICT=OFF' "$f" \
            || { echo "TBB_STRICT=OFF was not applied"; exit 1; }

      # CMakeLists.txt:767-773 points JAVA_HOME at <build>/vm/jdk8 and then calls
      # find_package(JNI). That directory is downloaded by the pl_install_jdk
      # build target, so at configure time it does not exist yet and FindJNI
      # falls back to whatever JDK is installed system wide. There is none here
      # on purpose -- the build has to be JDK 8 -- so point FindJNI straight at
      # the JDK 8 that setup-java unpacked.
      - name: Build CUBRID with this manager server
        working-directory: cubrid
        run: |
          set -euo pipefail
          export CCACHE_DIR=$HOME/.ccache
          export PATH="/usr/lib/ccache:$PATH"
          # The toolcache entry is a symlink to /usr/lib/jvm/temurin-8-jdk-amd64,
          # and find does not descend into a symlinked directory unless it is
          # told to, so resolve it first.
          jdk8=$(readlink -f "${JAVA_HOME_8_X64:-$JAVA_HOME}")
          java -version 2>&1 | head -1
          echo "make in use: $(command -v make) ($(make --version | head -1))"
          echo "cores: $(nproc), memory: $(free -g | awk '/^Mem:/{print $2"G"}')"
          echo "JDK 8 for JNI: $jdk8"

          libjvm=$(find -L "$jdk8" -name libjvm.so -print -quit)
          jnih=$(find -L "$jdk8"   -name jni.h     -print -quit)
          jnimdh=$(find -L "$jdk8" -name jni_md.h  -print -quit)
          if [ -z "$libjvm" ] || [ -z "$jnih" ] || [ -z "$jnimdh" ]; then
            echo "the JDK at $jdk8 is missing what JNI needs; it contains:"
            ls -l "$jdk8/"
            find -L "$jdk8" -name '*.so' -printf '  %p\n' | head -40
            find -L "$jdk8" -name 'jni*.h' -printf '  %p\n' | head -10
            exit 1
          fi

          # FindJNI asks for AWT as well, but on Linux the engine only consumes
          # the include directories: CMakeLists.txt uses JNI_FOUND to set
          # JAVA_INC, and JVM_LIBS is a Windows only branch. Some JDK 8 builds
          # ship no libawt.so, so when it is absent the variable is pointed at
          # libjvm.so purely to satisfy the REQUIRED check.
          libawt=$(find -L "$jdk8" -name libawt.so -print -quit)
          if [ -z "$libawt" ]; then
            echo "no libawt.so in this JDK; satisfying FindJNI with libjvm.so"
            libawt=$libjvm
          fi
          echo "  libjvm=$libjvm"
          echo "  libawt=$libawt"
          echo "  jni.h=$jnih"
          echo "  jni_md.h=$jnimdh"

          # ExternalProject sends its output to log files, so a failure prints
          # only "Command failed: N". Dump those logs here, in the same step, so
          # the cause sits next to the error instead of further down the run.
          dump_ep_logs () {
            echo "::group::3rdparty ExternalProject logs"
            for f in $(find build_x86_64_release/3rdparty/Stamp -name '*.log' \
                       -newermt '-30 minutes' 2>/dev/null | sort); do
              [ -s "$f" ] || continue
              echo "===== $f"
              tail -n 60 "$f"
            done
            echo "::endgroup::"
            echo "===== lines that look like the cause"
            find build_x86_64_release/3rdparty/Stamp -name '*.log' 2>/dev/null \
              | xargs grep -h -i -E 'error|fatal|Killed|signal 9|virtual memory|No space' 2>/dev/null \
              | sort -u | head -30 || echo "  nothing matched"
            echo "===== out of memory kills, if any"
            dmesg 2>/dev/null | grep -i -m5 'killed process' || echo "  none visible"
            echo "===== disk"
            df -h . | tail -1
          }

          set +e
          ./build.sh -m release -j "$jdk8" -p "$GITHUB_WORKSPACE/CUBRID" \
            -c "-DJAVA_AWT_LIBRARY=$libawt \
                -DJAVA_JVM_LIBRARY=$libjvm \
                -DJAVA_INCLUDE_PATH=$(dirname "$jnih") \
                -DJAVA_INCLUDE_PATH2=$(dirname "$jnimdh") \
                -DJAVA_AWT_INCLUDE_PATH=$(dirname "$jnih")" \
            build
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            dump_ep_logs
            echo "build.sh exited $rc"
            exit $rc
          fi
          test -x "$GITHUB_WORKSPACE/CUBRID/bin/cub_manager" \
            || { echo "cub_manager was not built"; exit 1; }

      # ExternalProject hides its output in log files, so a failure above shows
      # only "Command failed". Print the tails so the run is diagnosable.
      - name: Show 3rdparty build logs on failure
        if: failure()
        working-directory: cubrid
        run: |
          set -uo pipefail
          for f in $(find build_x86_64_release/3rdparty/Stamp -name '*-build-*.log' 2>/dev/null); do
            echo "===== $f"
            tail -n 40 "$f"
          done
          echo "===== out of memory kills, if any"
          dmesg 2>/dev/null | grep -i -m5 'killed process' || echo "  none visible"

      # The suite runs every case against demodb: it reads its volumes, unloads
      # its classes and opens transactions on it. The demo data has to be there,
      # not just an empty database.
      - name: Create demodb and start the service
        run: |
          set -euo pipefail
          export CUBRID="$GITHUB_WORKSPACE/CUBRID"
          export CUBRID_DATABASES="$CUBRID/databases"
          export LD_LIBRARY_PATH="$CUBRID/lib:${LD_LIBRARY_PATH:-}"
          export PATH="$CUBRID/bin:$PATH"
          mkdir -p "$CUBRID_DATABASES"
          sh "$CUBRID/demo/make_cubrid_demo.sh"
          cubrid service start
          cubrid server start demodb
          for i in $(seq 1 60); do
            pgrep -f '^cub_server demodb$' >/dev/null && break
            sleep 1
          done
          pgrep -f '^cub_server demodb$' >/dev/null \
            || { echo "demodb did not start"; cubrid server status; exit 1; }

      - name: Run the API test suite
        id: run
        working-directory: cubrid/cubridmanager/server/test
        run: |
          set -uo pipefail
          export CUBRID="$GITHUB_WORKSPACE/CUBRID"
          export CUBRID_DATABASES="$CUBRID/databases"
          export LD_LIBRARY_PATH="$CUBRID/lib:${LD_LIBRARY_PATH:-}"
          export PATH="$CUBRID/bin:$PATH"
          ./run_tests.sh -fc "${{ steps.version.outputs.short }}" "$TEST_SET" \
            2>&1 | tee run.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # The verdict is reported, not enforced: a failure here must not stop
          # the PR from being merged.
          exit 0

      - name: Summarise the result
        id: summary
        if: always()
        working-directory: cubrid/cubridmanager/server/test
        run: |
          set -uo pipefail
          status='${{ steps.run.outputs.status }}'
          if [ ! -f run.log ]; then
            # The suite never ran: something before it failed, usually the build.
            verdict='⚠️ NOT RUN'
            echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
            {
              echo "## CMS API test — $verdict"
              echo
              echo "The suite did not run; an earlier step failed. See the build"
              echo "step for the cause."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$status" = "0" ]; then
            verdict='✅ PASS'
          else
            verdict='❌ FAIL'
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

          {
            echo "## CMS API test — $verdict"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| engine | \`${ENGINE_REPO}@${ENGINE_REF}\` (VERSION ${{ steps.version.outputs.full }}) |"
            echo "| test set | \`$TEST_SET\` |"
            echo "| baselines | \`${{ steps.version.outputs.dir }}/\` |"
            echo
            tail -n 3 run.log | grep -E 'succeeded|failed' || true
            echo
            if [ "$status" != "0" ]; then
              echo "<details><summary>failed cases</summary>"
              echo
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' run.log | sed -n '/task(s) failed/,$p' | head -40
              echo '```'
              echo
              echo "</details>"
            fi
            echo
            echo "This check never blocks the merge; it only reports."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the result on the PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true   # a PR from a fork has no write token
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cms-api-test
          message: |
            **CMS API test — ${{ steps.summary.outputs.verdict }}**

            engine `${{ env.ENGINE_REPO }}@${{ env.ENGINE_REF }}` (VERSION ${{ steps.version.outputs.full }}),
            baselines `${{ steps.version.outputs.dir }}/`.
            See the job summary for the failing cases. This check does not block the merge.

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-api-test-${{ steps.version.outputs.dir }}
          path: |
            cubrid/cubridmanager/server/test/run.log
            cubrid/cubridmanager/server/test/log/
            cubrid/cubridmanager/server/test/task_test_case/task_result_check/${{ steps.version.outputs.dir }}/*.result
          retention-days: 14
          if-no-files-found: warn
