name: CMS API test

# Builds CUBRID with this PR's manager server and runs server/test against it.
#
# The build runs in a Rocky Linux 8.10 container so that CUBRID is compiled
# with the GCC 8 toolchain the product targets; on the runner's GCC 13 the
# engine does not compile, because it promotes warnings to errors and GCC 13
# reports things GCC 8 does not.
#
# The result never blocks a merge: the job finishes green either way and says
# PASS or FAIL in the job summary and in a comment on the PR. To make it
# blocking, replace the "exit 0" at the end of the test step with
# "exit $status" and mark this check as required for develop.
#
# In a fork, pushing any branch runs it; in CUBRID/cubrid-manager-server only
# pull requests to develop and manual runs do. Set the repository variable
# ENGINE_REPO or pass engine_repo to build against a fork of the engine.

on:
  pull_request:
    branches: [develop]
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      engine_repo:
        description: 'engine repository to build against'
        default: CUBRID/cubrid
        required: false
      engine_ref:
        description: 'engine branch or tag to build against'
        default: develop
        required: false

concurrency:
  group: cms-api-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # A container job would otherwise use sh; these steps use bash syntax.
    shell: bash

permissions:
  contents: read
  pull-requests: write

env:
  ENGINE_REPO: ${{ github.event.inputs.engine_repo || vars.ENGINE_REPO || 'CUBRID/cubrid' }}
  ENGINE_REF: ${{ github.event.inputs.engine_ref || vars.ENGINE_REF || 'develop' }}
  TEST_SET: task_status_check.txt
  CMAKE_VERSION: 3.28.3
  NINJA_VERSION: 1.11.1

jobs:
  cms-api-test:
    if: >-
      github.event_name != 'push' ||
      github.repository != 'CUBRID/cubrid-manager-server'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: rockylinux/rockylinux:8.10
      # --init puts a reaping init at PID 1. Without it an exited cub_server is
      # reparented to a PID 1 that never calls wait(), so it stays <defunct>;
      # the manager's stopdb waits for the process to be reaped and gives up
      # with "execute timeout" even though the database is already down.
      options: --init

    steps:
      # Before the checkouts: actions/checkout needs git in the container, or
      # it falls back to a tarball and the submodules do not come along.
      - name: Install the toolchain and test dependencies
        run: |
          set -euo pipefail
          dnf -y install epel-release
          # ninja-build and systemtap-sdt-devel live in CodeReady Builder,
          # which is off by default.
          /usr/bin/crb enable 2>/dev/null \
            || dnf -y config-manager --set-enabled powertools \
            || dnf -y config-manager --set-enabled crb \
            || echo "could not enable CRB; some packages may be missing"

          dnf -y install \
            git gcc gcc-c++ make bison flex \
            libtool autoconf automake patch file which rsync tar gzip xz curl unzip \
            ncurses-devel expat-devel zlib-devel systemtap-sdt-devel \
            elfutils-libelf-devel libstdc++-static \
            glibc-gconv-extra glibc-langpack-ko glibc-langpack-en \
            java-1.8.0-openjdk-devel ant \
            python3 procps-ng diffutils

          # build.sh runs "ninja install" by name, and the EL package installs
          # the binary as ninja-build.
          dnf -y install ninja-build || true
          if ! command -v ninja >/dev/null && command -v ninja-build >/dev/null; then
            ln -s "$(command -v ninja-build)" /usr/local/bin/ninja
          fi
          if ! command -v ninja >/dev/null; then
            curl -fsSL -o /tmp/ninja.zip \
              https://github.com/ninja-build/ninja/releases/download/v$NINJA_VERSION/ninja-linux.zip
            unzip -o /tmp/ninja.zip -d /usr/local/bin
            chmod 0755 /usr/local/bin/ninja
          fi
          command -v ninja >/dev/null \
            || { echo "ninja is required and could not be installed"; exit 1; }

          gcc --version | head -1
          ninja --version

          # Checked here so a missing piece fails with a clear reason instead
          # of as an obscure error deep in the build.
          command -v pgrep >/dev/null || { echo "pgrep is missing"; exit 1; }
          echo test | iconv -f utf-8 -t euckr >/dev/null \
            || { echo "iconv cannot convert to euckr"; exit 1; }
          ls /usr/lib/gcc/x86_64-redhat-linux/*/libstdc++.a >/dev/null \
            || { echo "libstdc++.a is missing"; exit 1; }
          test -f /usr/include/nlist.h \
            || { echo "nlist.h is missing"; exit 1; }

      - name: Install CMake ${{ env.CMAKE_VERSION }}
        # Rocky 8 ships 3.20 and the engine asks for 3.21.
        run: |
          set -euo pipefail
          url=https://github.com/Kitware/CMake/releases/download
          curl -fsSL "$url/v$CMAKE_VERSION/cmake-$CMAKE_VERSION-linux-x86_64.tar.gz" \
            | tar xz -C /opt
          echo "/opt/cmake-$CMAKE_VERSION-linux-x86_64/bin" >> "$GITHUB_PATH"
          "/opt/cmake-$CMAKE_VERSION-linux-x86_64/bin/cmake" --version | head -1

      # The manager server is a submodule of the engine at path cubridmanager,
      # so the engine is checked out and this PR replaces that submodule.
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          submodules: recursive
          fetch-depth: 1
          path: cubrid

      - name: Check out this PR over the cubridmanager submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: cubrid/cubridmanager

      - name: Read the engine version
        id: version
        working-directory: cubrid
        run: |
          set -euo pipefail
          full=$(tr -d '[:space:]' < VERSION)
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "engine VERSION=$full"

      - name: Cap the libtbb build parallelism
        # libtbb builds with a bare "make -j", which starts one compiler per
        # translation unit at once. Belongs upstream as
        # "make -j${CMAKE_BUILD_PARALLEL_LEVEL}".
        working-directory: cubrid
        run: |
          set -euo pipefail
          f=3rdparty/CMakeLists.txt
          sed -i -E "s/(BUILD_COMMAND[[:space:]]+make) -j$/\1 -j$(nproc)/;
                     s/(INSTALL_COMMAND[[:space:]]+make) -j install$/\1 -j$(nproc) install/" "$f"
          grep -n -- 'make -j' "$f" | sed 's/^/  /'

      # CUBRID is meant to be run by its own unprivileged owner, and a
      # container job is root, so everything from here runs as cubrid.
      - name: Create the cubrid user
        run: |
          set -euo pipefail
          useradd -m -s /bin/bash cubrid
          mkdir -p "$GITHUB_WORKSPACE/CUBRID"
          chown -R cubrid:cubrid "$GITHUB_WORKSPACE"

      - name: Build CUBRID with this manager server
        run: |
          set -euo pipefail
          JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")
          java -version 2>&1 | head -1
          echo "cores: $(nproc), memory: $(free -g | awk '/^Mem:/{print $2"G"}')"

          cat > /tmp/build-as-cubrid.sh <<'EOS'
          set -euo pipefail
          cd "$WORKSPACE/cubrid"
          ./build.sh -m release -g ninja -j "$JAVA_HOME" \
            -p "$WORKSPACE/CUBRID" build
          EOS
          chmod 0755 /tmp/build-as-cubrid.sh

          set +e
          runuser -u cubrid -- env HOME=/home/cubrid PATH="$PATH" \
            JAVA_HOME="$JAVA_HOME" WORKSPACE="$GITHUB_WORKSPACE" \
            bash /tmp/build-as-cubrid.sh
          rc=$?
          set -e

          # ExternalProject keeps its output in log files, so a failure prints
          # only "Command failed"; show the logs of whatever did not finish.
          if [ $rc -ne 0 ]; then
            cd cubrid
            stamp=build_x86_64_release/3rdparty/Stamp
            echo "===== external projects that configured but did not build"
            failed=""
            for d in "$stamp"/*/; do
              n=$(basename "$d")
              [ -f "$d/$n-configure" ] || continue
              [ -f "$d/$n-build" ] || { echo "  $n"; failed="$failed $n"; }
            done
            [ -n "$failed" ] \
              || echo "  (none; look for a FAILED: line in the ninja output above)"
            for n in $failed; do
              for f in "$stamp/$n/$n-build-err.log" "$stamp/$n/$n-build-out.log"; do
                [ -s "$f" ] || continue
                echo "===== $f (last 80 lines)"; tail -n 80 "$f"
              done
            done
            echo "===== compiler errors across all 3rdparty logs"
            grep -h -E 'error:|fatal error|Error [0-9]+|cannot find|No such file or directory' \
              "$stamp"/*/*.log 2>/dev/null | sort -u | head -30 \
              || echo "  none matched"
            echo "===== disk"; df -h . | tail -1
            exit $rc
          fi
          test -x "$GITHUB_WORKSPACE/CUBRID/bin/cub_manager" \
            || { echo "cub_manager was not built"; exit 1; }

      # A build from source installs this repository's own cm.conf, which has
      # support_mon_statistic=NO, while the released packages ship YES. With it
      # off the monitoring gather never runs, and set_mon_interval and the
      # volume cases of get_mon_statistic fail on data that was never collected.
      - name: Turn on monitoring statistics
        run: |
          set -euo pipefail
          conf="$GITHUB_WORKSPACE/CUBRID/conf/cm.conf"
          sed -i -E 's/^([[:space:]]*support_mon_statistic[[:space:]]*=?[[:space:]]*).*/\1YES/' "$conf"
          grep -q -i 'support_mon_statistic.*YES' "$conf" \
            || { echo "support_mon_statistic is not YES in $conf"; cat "$conf"; exit 1; }
          grep -n -i 'support_mon_statistic' "$conf" | sed 's/^/  /'

      # Only the database is created here; the suite starts the service itself
      # to reach a known state before the first case.
      - name: Create demodb
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cat > /tmp/demodb-as-cubrid.sh <<'EOS'
          set -euo pipefail
          export CUBRID="$WORKSPACE/CUBRID"
          export CUBRID_DATABASES="$CUBRID/databases"
          export LD_LIBRARY_PATH="$CUBRID/lib:${LD_LIBRARY_PATH:-}"
          export PATH="$CUBRID/bin:$PATH"
          # make_cubrid_demo.sh runs "cubrid createdb demodb" with no path, so
          # the volumes land in the current directory. An installed CUBRID puts
          # them in $CUBRID_DATABASES/demodb, and the cases address them there
          # (get_mon_statistic asks for $CUBRID_DATABASES/demodb/demodb), so the
          # script has to be run from that directory.
          mkdir -p "$CUBRID_DATABASES/demodb"
          cd "$CUBRID_DATABASES/demodb"
          sh "$CUBRID/demo/make_cubrid_demo.sh"
          grep -q '^demodb' "$CUBRID_DATABASES/databases.txt" \
            || { echo "demodb was not registered in databases.txt"; exit 1; }
          test -f "$CUBRID_DATABASES/demodb/demodb" \
            || { echo "the demodb volume is not where the cases expect it:"
                 cat "$CUBRID_DATABASES/databases.txt"; exit 1; }
          timeout 300 cubrid service stop || echo "service stop returned $?"
          EOS
          chmod 0755 /tmp/demodb-as-cubrid.sh
          runuser -u cubrid -- env HOME=/home/cubrid PATH="$PATH" \
            WORKSPACE="$GITHUB_WORKSPACE" bash /tmp/demodb-as-cubrid.sh

      - name: Run the API test suite
        id: run
        timeout-minutes: 60
        run: |
          set -uo pipefail
          cat > /tmp/test-as-cubrid.sh <<'EOS'
          set -uo pipefail
          export CUBRID="$WORKSPACE/CUBRID"
          export CUBRID_DATABASES="$CUBRID/databases"
          export LD_LIBRARY_PATH="$CUBRID/lib:${LD_LIBRARY_PATH:-}"
          export PATH="$CUBRID/bin:$PATH"
          # Python block buffers into a pipe, which would hide the progress of
          # the whole run until it ended.
          export PYTHONUNBUFFERED=1
          cd "$WORKSPACE/cubrid/cubridmanager/server/test"
          timeout --signal=INT --kill-after=1m 50m \
            ./run_tests.sh "$TEST_SET" </dev/null 2>&1 | tee run.log
          exit ${PIPESTATUS[0]}
          EOS
          chmod 0755 /tmp/test-as-cubrid.sh
          runuser -u cubrid -- env HOME=/home/cubrid PATH="$PATH" \
            WORKSPACE="$GITHUB_WORKSPACE" TEST_SET="$TEST_SET" \
            bash /tmp/test-as-cubrid.sh
          status=$?
          if [ $status -eq 124 ] || [ $status -eq 137 ]; then
            echo "the suite did not finish in time; the last case in run.log"
            echo "above is where it stopped making progress"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # Reported, not enforced.
          exit 0

      - name: Summarise the result
        id: summary
        if: always()
        working-directory: cubrid/cubridmanager/server/test
        run: |
          set -uo pipefail
          status='${{ steps.run.outputs.status }}'
          if [ ! -f run.log ]; then
            verdict='⚠️ NOT RUN'
            echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
            {
              echo "## CMS API test — $verdict"
              echo
              echo "The suite did not run; an earlier step failed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$status" = "0" ]; then verdict='✅ PASS'; else verdict='❌ FAIL'; fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

          {
            echo "## CMS API test — $verdict"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| engine | \`${ENGINE_REPO}@${ENGINE_REF}\` (VERSION ${{ steps.version.outputs.full }}) |"
            echo "| built on | Rocky Linux 8.10, gcc $(gcc -dumpversion) |"
            echo "| test set | \`$TEST_SET\` |"
            echo
            tail -n 3 run.log | grep -E 'succeeded|failed' || true
            echo
            if [ "$status" != "0" ]; then
              echo "<details><summary>failed cases</summary>"
              echo
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' run.log | sed -n '/task(s) failed/,$p' | head -40
              echo '```'
              echo
              echo "</details>"
            fi
            echo
            echo "This check never blocks the merge; it only reports."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the result on the PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true   # a PR from a fork has no write token
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cms-api-test
          message: |
            **CMS API test — ${{ steps.summary.outputs.verdict }}**

            engine `${{ env.ENGINE_REPO }}@${{ env.ENGINE_REF }}` (VERSION ${{ steps.version.outputs.full }}),
            test set `${{ env.TEST_SET }}`, built on Rocky Linux 8.10.
            See the job summary for the failing cases. This check does not block the merge.

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-api-test
          path: |
            cubrid/cubridmanager/server/test/run.log
            cubrid/cubridmanager/server/test/log/
            CUBRID/log/
            CUBRID/conf/cm.conf
          retention-days: 14
          if-no-files-found: warn
